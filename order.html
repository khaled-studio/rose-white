<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose White - حجز موعد مسبق</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23121212' stroke='%23D4AF37' stroke-width='3'/><text x='50%' y='62%' text-anchor='middle' fill='%23D4AF37' font-family='serif' font-size='42' font-weight='bold'>RW</text></svg>">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./output.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Alex+Brush&family=Cairo:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>



    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #FAF9F6;
            overflow-x: hidden;
        }

        .font-cursive {
            font-family: 'Alex Brush', cursive;
        }

        @keyframes shimmerGold {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF 0%, #FFE8A3 30%, #D4AF37 50%, #FFF 70%, #AA820A 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerGold 6s linear infinite;
        }

        .hero-overlay {
            background: radial-gradient(circle at center, rgba(18, 18, 18, 0.75) 0%, rgba(18, 18, 18, 0.95) 100%);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between relative bg-cover bg-center"
    style="background-image: url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&q=80&w=2000');">

    <!-- Radial Overlay for Background -->
    <div class="absolute inset-0 hero-overlay pointer-events-none"></div>

    <!-- Navigation Header -->
    <header class="relative z-20 border-b border-gold-400/20 bg-black/40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-full border border-gold-400 flex items-center justify-center text-gold-400 font-cursive text-2xl font-bold">
                    RW
                </div>
                <span class="font-amiri text-xl tracking-wider text-gold-300 font-semibold">ROSE WHITE</span>
            </a>

            <a href="index.html"
                class="text-xs text-gold-300 hover:text-white flex items-center gap-2 border border-gold-400/30 px-4 py-2 rounded-full transition-all">
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                <span>العودة للموقع الرئيسي</span>
            </a>
        </div>
    </header>

    <!-- MAIN FORM SECTION -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-8 my-8">
        <div
            class="max-w-xl w-full bg-charcoal/90 backdrop-blur-xl border border-gold-400/30 rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden">

            <!-- Header Text -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 rounded-full border border-gold-400/50 flex items-center justify-center mx-auto mb-4 bg-gold-400/10 text-gold-400">
                    <i data-lucide="calendar-check" class="w-8 h-8"></i>
                </div>
                <h1 class="text-3xl sm:text-4xl font-bold font-amiri gold-gradient-text mb-3">حجز موعد مسبق</h1>
                <div class="w-20 h-0.5 bg-gold-400/60 mx-auto rounded-full mb-4"></div>

                <!-- Notice Badge -->
                <div
                    class="bg-gold-400/10 border border-gold-400/30 text-gold-300 p-3.5 rounded-2xl text-xs sm:text-sm leading-relaxed text-center font-medium">
                    ✨ هذا حجز مسبق للحصول على أولوية في الحجز، ولتأكيد الحجز يرجى إرسال البيانات المطلوبة وزيارتنا.
                </div>
            </div>

            <!-- Booking Form -->
            <form id="bookingForm" onsubmit="sendToWhatsApp(event)" class="space-y-6">

                <!-- Full Name -->
                <div>
                    <label for="fullName" class="block text-xs font-semibold text-gold-300 mb-2">
                        الاسم بالكامل <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="text" id="fullName" required placeholder="أدخل اسمك الكريم"
                            class="w-full bg-white/5 border border-gold-400/20 rounded-xl px-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all pr-11">
                        <i data-lucide="user" class="w-5 h-5 text-gold-400/60 absolute right-3.5 top-3.5"></i>
                    </div>
                </div>


                <!-- Phone Number -->
                <div>
                    <label for="phoneNumber" class="block text-xs font-semibold text-gold-300 mb-2">
                        رقم الهاتف <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="tel" id="phoneNumber" required dir="ltr" inputmode="numeric" pattern="[0-9]*"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')" placeholder="01012345678"
                            class="w-full bg-white/5 border border-gold-400/20 rounded-xl px-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all text-right pr-11">
                        <i data-lucide="phone" class="w-5 h-5 text-gold-400/60 absolute right-3.5 top-3.5"></i>
                    </div>
                </div>

                <!-- Reservation Date -->
                <div>
                    <label for="bookingDate" class="block text-xs font-semibold text-gold-300 mb-2">
                        الموعد المطلوب حجزه (التاريخ) <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="date" id="bookingDate" required
                            class="w-full bg-white/5 border border-gold-400/20 rounded-xl px-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all pr-11 [color-scheme:dark]">
                        <i data-lucide="calendar" class="w-5 h-5 text-gold-400/60 absolute right-3.5 top-3.5"></i>
                    </div>
                    <!-- Required Note -->
                    <p class="text-[11px] text-amber-300/80 mt-1.5 flex items-center gap-1 font-light">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 inline"></i>
                        <span>ملحوظة: قد يكون الموعد غير متاح.</span>
                    </p>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-600 via-emerald-500 to-emerald-600 text-white font-bold text-sm shadow-lg hover:shadow-emerald-500/25 hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 flex items-center justify-center gap-2 mt-8">
                    <i data-lucide="message-circle" class="w-5 h-5"></i>
                    <span>إرسال</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 bg-black/60 border-t border-white/10 py-4 text-center text-xs text-gray-500">
        <p>© 2026 Rose White Hall - جميع الحقوق محفوظة.</p>
    </footer>

    <!-- Script Handling WhatsApp Formatting -->
    <script>
        lucide.createIcons();

        // ========================================================
        // ⚙️ رقم الواتساب المستقبل (يمكنك تعديل الرقم بسهولة من هنا)
        // ========================================================
        const RECEIVER_WHATSAPP_NUMBER = "201064503479"; // الصيغة الدولية بدون علامة +

        function sendToWhatsApp(event) {
            event.preventDefault();

            // قراءة البيانات من المدخلات
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const date = document.getElementById('bookingDate').value;

            // تنسيق الرسالة بطريقة أنيقة وممتعة
            const message =
                `👑 *طلب حجز مسبق - Rose White Hall*
----------------------------------
 *الاسم:* ${name}
 *رقم الهاتف:* ${phone}
 *التاريخ المطلوب:* ${date}
----------------------------------
 أود تأكيد إمكانية توافر هذا الموعد للزيارة والحجز.`;

            // تشفير النص المكتوب ليكون متوافقاً مع روابط الويب
            const encodedMessage = encodeURIComponent(message);

            // إنشاء رابط الواتساب المباشر
            const whatsappURL = `https://wa.me/${RECEIVER_WHATSAPP_NUMBER}?text=${encodedMessage}`;

            // فتح الواتساب في نافذة جديدة
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>

</html>
